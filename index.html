<!doctype html>
<html lang="zh-CN">
  <head>

    />
    <link
      rel="preload"
      href="/fonts/titillium-web-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/titillium-web-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>中山大学计算机学院</title>
    <meta
      name="description"
      content="xxx"
    />
    <meta
      name="keywords"
      content="沈明华,中山大学,计算机体系结构,人工智能芯片,可持续计算,绿色数据中心,算力集群,软硬件协同,xxx,先进计算研究所"
    />
    <meta name="author" content="Sustainable Architecture and Intelligence Lab (SAIL), Sun Yat-sen University" />
    <meta name="theme-color" content="#336699" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="xxx" />
    <meta property="og:title" content="xxx" />
    <meta
      property="og:description"
      content="面向新一代人工智能应用需求，研发可扩展、可持续、可管理的 AI 芯片与 AI 集群。"
    />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ResearchOrganization",
        "name": "xxx",
        "alternateName": "xxx",
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "xxx"
        },
        "member": {
          "@type": "Person",
          "name": "xxx",
          "jobTitle": "xxx",
          "email": "xxx",
          "affiliation": "xxx"
        },
        "knowsAbout": [
          "计算机体系结构",
          "人工智能芯片",
          "可持续计算",
          "高性能计算系统",
          "算力集群",
          "软硬件协同设计"
        ]
      }
    </script>

    <style>
      /* 首屏防白闪：与设计基调一致的底色，避免字体/样式加载期间的颜色跳变 */
      html {
        background-color: #fdfdfd;
      }

      /*
       * 应用挂载前的加载提示。Vue 挂载时会清空 #app，这段标记随之移除。
       * 延迟 200ms 才淡入：快网络下通常看不到，慢网络下不会一直白屏。
       */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fdfdfd;
        color: #666;
        font: 14px/1.6 'Open Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        opacity: 0;
        animation: boot-in 0.25s ease 0.2s forwards;
      }
      .boot-mark {
        width: 28px;
        height: 28px;
        border: 3px solid #d8e3ec;
        border-top-color: #336699;
        border-right-color: #f66733;
        border-radius: 999px;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation-duration: 1.8s;
        }
      }
    </style>
    <noscript>
      <style>
        /* 禁用 JS 时不要让加载提示遮住下面的说明文字 */
        .boot {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <span class="boot-mark" aria-hidden="true"></span>
        <span>正在加载…</span>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        本站需要启用 JavaScript 才能浏览。
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
